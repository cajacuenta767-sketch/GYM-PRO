name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · tipos y pruebas de integración
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - name: Lint
        run: npm run lint -w apps/api
      - name: Verificar tipos
        run: npx tsc --noEmit -p tsconfig.build.json
        working-directory: apps/api
      - name: Compilar
        run: npm run build -w apps/api
      - name: Pruebas de integración (supertest)
        run: npm test -w apps/api

  web:
    name: Web · tipos y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Lint
        run: npm run lint -w apps/web
      - name: Verificar tipos
        run: npm run typecheck -w apps/web
      - name: Compilar (incluye PWA)
        run: npm run build -w apps/web

  e2e:
    name: Extremo a extremo · Playwright
    runs-on: ubuntu-latest
    needs: [api, web]
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-secret
      LOGIN_RATE_LIMIT: 50
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate && npx prisma db push --skip-generate && npm run db:seed
        working-directory: apps/api
      - run: npm run build -w apps/api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Ejecutar Playwright (levanta API y web)
        run: npx playwright test
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
