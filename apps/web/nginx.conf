server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # API y archivos subidos → contenedor de la API
  location /api/ { proxy_pass http://api:4000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; client_max_body_size 10m; }
  location /uploads/ { proxy_pass http://api:4000/uploads/; }

  # Cache largo para recursos con hash
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location = /sw.js { add_header Cache-Control "no-cache"; }

  # SPA
  location / { try_files $uri $uri/ /index.html; }
}
